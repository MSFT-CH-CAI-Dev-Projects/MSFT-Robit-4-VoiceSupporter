# Central Feed Services (CFS) package index.
# Microsoft-managed devices block direct access to pypi.org / files.pythonhosted.org.
# All pip installs must go through the approved CFS proxy feed instead.
#
# Local dev — point pip at this file for the current session:
#   PowerShell:  $env:PIP_CONFIG_FILE = "$PWD\pip.conf"
#   bash/zsh:    export PIP_CONFIG_FILE="$PWD/pip.conf"
# ...or set it once at user level (persists for all projects):
#   pip config set global.index-url https://packagefeedproxy.microsoft.io/pypi/simple
[global]
index-url = https://packagefeedproxy.microsoft.io/pypi/simple
